[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omiagent"
version = "0.1.0"
description = "OmiAgent — self-hosted autonomous coding agent with a workspace UI and smart BYOK model routing (a friendlier arena.ai/agent you run yourself)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omi" }]
keywords = ["ai-agent", "coding-agent", "autonomous", "self-hosted", "litellm", "fastapi", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "litellm>=1.48",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
omiagent = "omiagent.__main__:main"

[project.urls]
Homepage = "https://github.com/<you>/omiagent"
Issues = "https://github.com/<you>/omiagent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omiagent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "SIM105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
